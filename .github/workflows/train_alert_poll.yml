name: Train Manager 24/7 Live Tracker

on:
  schedule:
    # 24/7 Live Radar: runs every 15 minutes to check real in-game prices
    # directly from trainmanager.cc
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: train-tracker
  cancel-in-progress: false

jobs:
  run-train-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore train alert state cache
        uses: actions/cache@v4
        with:
          path: train-alert/train_state.json
          key: train-state-${{ github.run_id }}
          restore-keys: |
            train-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: train-alert/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r train-alert/requirements.txt

      - name: Run Train Manager 24/7 Live Tracker
        env:
          EM_EMAIL: ${{ secrets.EM_EMAIL }}
          EM_PASSWORD: ${{ secrets.EM_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python train-alert/train_fuel_notifier.py
