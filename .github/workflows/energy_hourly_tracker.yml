name: Energy Manager Hourly Live Tracker

on:
  schedule:
    # 01:18 UTC to 18:18 UTC = 06:48 AM IST to 11:48 PM IST (Hourly live checks)
    # Minute 18 avoids standard :00 and :30 congestion delays on GitHub Actions runners
    - cron: '18 1-18 * * *'
  workflow_dispatch:

jobs:
  run-energy-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore energy alert state cache
        uses: actions/cache@v4
        with:
          path: |
            energy-alert/energy_state.json
          key: energy-state-${{ github.run_id }}
          restore-keys: |
            energy-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Energy Manager Live Tracker
        env:
          EM_EMAIL: ${{ secrets.EM_EMAIL || 'abhijaychauhan98@duck.com' }}
          EM_PASSWORD: ${{ secrets.EM_PASSWORD || 'alok@singh' }}
        run: |
          python energy-alert/energy_fuel_notifier.py
