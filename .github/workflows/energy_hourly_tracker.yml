name: Energy Manager Hourly Live Tracker

on:
  schedule:
    # 1. Morning Briefing Retry Window: 06:30 AM to 07:30 AM IST
    #    = 01:00 UTC to 02:00 UTC (IST = UTC + 5:30)
    - cron: '0,10,20,30,40,50 1 * * *'
    - cron: '0 2 * * *'
    # 2. Hourly Live Radar: 07:48 AM to 11:48 PM IST
    #    = 02:18 UTC to 18:18 UTC
    - cron: '18 2-18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-tracker
  cancel-in-progress: false

jobs:
  run-energy-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore energy alert state cache
        uses: actions/cache@v4
        with:
          path: energy-alert/energy_state.json
          key: energy-state-${{ github.run_id }}
          restore-keys: |
            energy-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: energy-alert/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r energy-alert/requirements.txt

      - name: Run Energy Manager Live Tracker
        env:
          # Energy Manager game credentials (GitHub Secrets):
          EM_EMAIL: ${{ secrets.EM_EMAIL }}
          EM_PASSWORD: ${{ secrets.EM_PASSWORD }}
          # ★ Energy-specific Discord webhook → #energy-alerts channel.
          # Separate from DISCORD_WEBHOOK_URL (which goes to #train-alerts).
          DISCORD_WEBHOOK_URL_ENERGY: ${{ secrets.DISCORD_WEBHOOK_URL_ENERGY }}
        run: |
          python energy-alert/energy_fuel_notifier.py
