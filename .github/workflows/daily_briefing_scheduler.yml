name: Daily Morning Briefing & 4-Chance Scheduler (Train & Truck)

on:
  schedule:
    # 00:23 UTC = 05:53 AM IST & 00:37 UTC = 06:07 AM IST
    # Dual-schedule with off-peak minutes prevents GitHub Actions queue drops and delays
    - cron: '23 0 * * *'
    - cron: '37 0 * * *'
  workflow_dispatch:

jobs:
  run-daily-schedulers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore daily state cache
        uses: actions/cache@v4
        with:
          path: |
            train-alert/train_state.json
            truck-alert/truck_state.json
          key: daily-sched-state-${{ github.run_id }}
          restore-keys: |
            daily-sched-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Train Manager Notifier (4 Fuel + 4 Spot)
        run: |
          python train-alert/train_fuel_notifier.py

      - name: Run Truck Manager Notifier (4 Diesel + 4 CO2 + 4 kWh)
        run: |
          python truck-alert/truck_fuel_notifier.py
