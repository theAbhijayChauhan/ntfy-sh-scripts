name: Train Manager Daily Briefing & Scheduler

on:
  schedule:
    # Continuous retry window 06:00 AM to 07:00 AM IST
    # = 00:30 UTC to 01:30 UTC (IST = UTC + 5:30)
    # Tries every 10 minutes until today's briefing is sent once,
    # then the script's state dedup skips subsequent runs for the day.
    - cron: '30,40,50 0 * * *'   # 00:30, 00:40, 00:50 UTC = 06:00, 06:10, 06:20 IST
    - cron: '0,10,20,30 1 * * *' # 01:00, 01:10, 01:20, 01:30 UTC = 06:30, 06:40, 06:50, 07:00 IST
  workflow_dispatch:

permissions:
  contents: read

# Prevent two concurrent runs from racing on the cache state.
concurrency:
  group: train-daily-scheduler
  cancel-in-progress: false

jobs:
  run-train-notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore train state cache
        uses: actions/cache@v4
        with:
          path: |
            train-alert/train_state.json
            train-alert/scheduled_alerts.json
          key: train-state-${{ github.run_id }}
          restore-keys: |
            train-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: train-alert/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r train-alert/requirements.txt

      - name: Run Train Manager Notifier (sends briefing + writes scheduled_alerts.json)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python train-alert/train_fuel_notifier.py
